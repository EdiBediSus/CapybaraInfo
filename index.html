<body>

<script>
// ------------------------------
// Client JS (fixed + minimal changes)
// ------------------------------

function openSettings() { alert("Settings menu not implemented yet!"); }
function openHow() { alert("Throw slippers, dodge chaos, win! WASD to move, Click to throw."); }

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 700;

// >>> CORRECTED WebSocket URL (you requested this)
const WS_URL = "wss://capybarainfo.onrender.com";
const socket = new WebSocket(WS_URL);

const PLAYER_SIZE = 16;
const BULLET_SIZE = 6;
const PLAYER_MAX_HP = 100;
const BULLET_SPEED = 10, SHOT_COOLDOWN_MS = 300, FRICTION = 0.86, SPEED = 3.2;
const BULLET_DAMAGE = 20, KNOCKBACK = 5;
const RESP_COOLDOWN_MS = 3000;
const MAP_CHANGE_INTERVAL = 180000;
const FIXED_TIMESTEP = 1000 / 60;

let lastFrameTime = Date.now();
let accumulator = 0;

let isAdmin = false;
let adminPassword = "";

// MAPS, player, bullets, otherPlayers same as before (kept identical)
const MAPS = [ /* ... same as before ... */ ];

// For brevity: reusing your original MAPS and CSS definitions — they are in the earlier file.
// (When you paste this file, keep the MAPS content exactly as you had it.)

// --- I'll inline the important runtime variables and DOM refs:
let currentMapIndex = 0;
let WALLS = MAPS[currentMapIndex].walls;

let player = { x:500, y:350, vx:0, vy:0, renderX:500, renderY:350, color:"#39f", id:null, hp:PLAYER_MAX_HP, displayHP:PLAYER_MAX_HP, username:"", deadUntil:0, kills:0 };
let bullets = [], otherPlayers = {}, lastShot = 0, keys = [];

const chatDiv = document.getElementById("chat");
const chatInput = document.getElementById("chatInput");
const cooldownText = document.getElementById("cooldownText");
const hpText = document.getElementById("hpText");
const deathMessage = document.getElementById("deathMessage");
const leaderboardList = document.getElementById("leaderboardList");
const startupScreen = document.getElementById("startupScreen");
const startupUsernameInput = document.getElementById("startupUsername");
const usernameInput = document.getElementById("usernameInput");
const connectStatus = document.getElementById("connectStatus");
const startGameBtn = document.getElementById("startGameBtn");
const adminToggle = document.getElementById("adminToggle");
const adminPanel = document.getElementById("adminPanel");
const adminPasswordInput = document.getElementById("adminPassword");

// hide admin password input container at page load (only show when "admin" typed)
document.getElementById("adminPasswordContainer").style.display = "none";

startupUsernameInput.value = "Player"+Math.floor(Math.random()*9000);

// admin toggle click (shows/hides admin panel)
adminToggle.addEventListener("click", () => {
    adminPanel.style.display = adminPanel.style.display === 'none' ? 'block' : 'none';
});

// username change in-game
usernameInput.addEventListener("keydown", e => {
    if(e.key === "Enter" && usernameInput.value.trim() !== "") {
        const newName = usernameInput.value.trim().slice(0, 16);
        player.username = newName;
        socket.send(JSON.stringify({type:"setName", name: newName}));
        usernameInput.value = "";
        usernameInput.blur();
    }
});

// ===================================
// ADMIN FUNCTIONS (client-side)
// ===================================
function adminChangeMap() {
    if(!isAdmin) { alert("❌ Admin access required!"); return; }
    socket.send(JSON.stringify({type:"adminChangeMap", password: adminPassword}));
}
function adminSetMap() {
    if(!isAdmin) { alert("❌ Admin access required!"); return; }
    const mapIndex = parseInt(document.getElementById("mapSelector").value);
    socket.send(JSON.stringify({type:"adminSetMap", mapIndex: mapIndex, password: adminPassword}));
}
function adminKillAll() {
    if(!isAdmin) { alert("❌ Admin access required!"); return; }
    if(confirm("⚠️ Kill all players?")) socket.send(JSON.stringify({type:"adminKillAll", password: adminPassword}));
}
function adminHealAll() {
    if(!isAdmin) { alert("❌ Admin access required!"); return; }
    socket.send(JSON.stringify({type:"adminHealAll", password: adminPassword}));
}
function adminResetKills() {
    if(!isAdmin) { alert("❌ Admin access required!"); return; }
    if(confirm("⚠️ Reset all player kills?")) socket.send(JSON.stringify({type:"adminResetKills", password: adminPassword}));
}
function adminKickPlayer(playerId, username) {
    if(!isAdmin) { alert("❌ Admin access required!"); return; }
    if(confirm(`⚠️ Kick player: ${username}?`)) socket.send(JSON.stringify({type:"adminKick", playerId: playerId, password: adminPassword}));
}
function adminBroadcast() {
    if(!isAdmin) { alert("❌ Admin access required!"); return; }
    const msg = document.getElementById("adminMessage").value.trim();
    if(msg === "") return;
    socket.send(JSON.stringify({ type:"adminBroadcast", message: msg, password: adminPassword }));
    document.getElementById("adminMessage").value = "";
}
function updateAdminPlayerList() {
    if(!isAdmin) return;
    const playerListDiv = document.getElementById("adminPlayerList");
    let html = '';
    html += `<div class="player-list-item"><span>👤 ${player.username} (You)</span><span>${player.kills} 💀</span></div>`;
    for(const id in otherPlayers) {
        const p = otherPlayers[id];
        html += `<div class="player-list-item"><span>👤 ${p.username}</span><span>${p.kills || 0} 💀</span><button class="kick-btn" onclick="adminKickPlayer('${id}', '${p.username}')">Kick</button></div>`;
    }
    playerListDiv.innerHTML = html || '<div style="opacity:0.5">No players</div>';
}

// ===================================
// WEBSOCKET EVENTS (client)
// ===================================
socket.onopen = ()=>{
    console.log("✅ Connected to server via WebSocket!");
    connectStatus.textContent = "Connected. Enter your name and click START!";
    startGameBtn.disabled = false;
};

socket.onerror = err=>{
    console.error("❌ WebSocket error:", err);
    connectStatus.textContent = "Connection failed. Check if server is running.";
};

socket.onclose = ()=>{
    console.warn("⚠️ WebSocket closed");
    connectStatus.textContent = "Disconnected from server.";
    startGameBtn.disabled = true;
    startupScreen.style.display = 'flex';
    adminToggle.style.display = 'none';
    adminPanel.style.display = 'none';
};

socket.onmessage = ev=>{
    let data;
    try { data = JSON.parse(ev.data); } catch(e) { return; }

    // init
    if(data.type === "init") {
        player.id = data.id;
        player.deadUntil = data.deadUntil || 0;
        player.hp = data.hp || PLAYER_MAX_HP;
        return;
    }

    // admin auth response
    if(data.type === "adminAuth") {
        isAdmin = !!data.success;
        if(isAdmin) {
            adminToggle.style.display = 'block';
            const line = document.createElement("div");
            line.style.color = "#ffcf60"; line.style.fontWeight = "bold";
            line.textContent = "👑 You are now an admin!";
            chatDiv.appendChild(line);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        } else {
            alert("❌ Invalid admin password!");
        }
        return;
    }

    // admin broadcast
    if(data.type === "adminBroadcast") {
        const line = document.createElement("div");
        line.style.color = "#ff5722"; line.style.fontWeight = "bold"; line.style.fontSize = "14px";
        line.textContent = `📢 [ADMIN]: ${data.message}`;
        chatDiv.appendChild(line);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        showMapNotification(`ADMIN: ${data.message}`);
        return;
    }

    // unified state handling: update otherPlayers OR local player so regen is visible to you too
    if(data.type === "state" && data.state && typeof data.playerId !== "undefined") {
        if(data.playerId === player.id) {
            // update local player from authoritative server state
            player.x = data.state.x ?? player.x;
            player.y = data.state.y ?? player.y;
            player.vx = data.state.vx ?? player.vx;
            player.vy = data.state.vy ?? player.vy;
            player.hp = data.state.hp ?? player.hp;
            player.username = data.state.username ?? player.username;
            player.color = data.state.color ?? player.color;
            player.deadUntil = data.state.deadUntil ?? player.deadUntil;
            player.kills = data.state.kills ?? player.kills;
            player.renderX = player.renderX ?? player.x;
            player.renderY = player.renderY ?? player.y;
            // If server provides bullets array for you, we can use it for rendering bullets
            if(Array.isArray(data.state.bullets)) {
                bullets = data.state.bullets;
            }
        } else {
            // other players
            const state = data.state;
            state.renderX = otherPlayers[data.playerId] ? otherPlayers[data.playerId].renderX : state.x;
            state.renderY = otherPlayers[data.playerId] ? otherPlayers[data.playerId].renderY : state.y;
            state.kills = state.kills || (otherPlayers[data.playerId] && otherPlayers[data.playerId].kills) || 0;
            state.bullets = state.bullets || [];
            otherPlayers[data.playerId] = state;
        }
        return;
    }

    // leave
    if(data.type === "leave") {
        delete otherPlayers[data.playerId];
        return;
    }

    // hit (for you)
    if(data.type === "hit" && data.playerId === player.id) {
        player.hp = data.hp;
        player.vx += data.knock.x;
        player.vy += data.knock.y;
        return;
    }

    // dead
    if(data.type === "dead") {
        if(data.playerId === player.id) {
            player.hp = 0;
            player.displayHP = 0;
            player.deadUntil = data.deadUntil || Date.now() + RESP_COOLDOWN_MS;
            player.vx = 0; player.vy = 0;
            deathMessage.style.display = 'block';
            setTimeout(()=> deathMessage.style.display = 'none', 3000);
        } else if(otherPlayers[data.playerId]) {
            otherPlayers[data.playerId].hp = 0;
            otherPlayers[data.playerId].deadUntil = data.deadUntil;
        }
        return;
    }

    // respawned
    if(data.type === "respawned") {
        if(data.playerId === player.id) {
            player.hp = PLAYER_MAX_HP;
            player.displayHP = PLAYER_MAX_HP;
            player.deadUntil = 0;
            player.x = 500; player.y = 350; player.vx = 0; player.vy = 0;
            player.renderX = 500; player.renderY = 350;
            deathMessage.textContent = "RESPAWNED!";
            deathMessage.style.color = "#4cd";
            deathMessage.style.display = 'block';
            setTimeout(()=>{
                deathMessage.style.display = 'none';
                deathMessage.textContent = "YOU DIED!";
                deathMessage.style.color = "#ff5722";
            }, 1000);
        } else if(otherPlayers[data.playerId]) {
            otherPlayers[data.playerId].hp = PLAYER_MAX_HP;
            otherPlayers[data.playerId].deadUntil = 0;
        }
        return;
    }

    // mapChange
    if(data.type === "mapChange") {
        currentMapIndex = data.mapIndex;
        WALLS = MAPS[currentMapIndex].walls;
        showMapNotification(MAPS[currentMapIndex].name);
        player.x = 500; player.y = 350; player.renderX = 500; player.renderY = 350; player.vx = 0; player.vy = 0;
        bullets = [];
        return;
    }

    // kill events & chat handled as before
    if(data.type === "kill") {
        if(data.killerId === player.id) player.kills = data.killerKills || (player.kills + 1);
        if(otherPlayers[data.killerId]) otherPlayers[data.killerId].kills = data.killerKills || ((otherPlayers[data.killerId].kills || 0) + 1);
        const killMsg = document.createElement("div");
        killMsg.style.color = "#ff5722";
        killMsg.style.fontWeight = "bold";
        killMsg.textContent = `💀 ${data.killerName} eliminated ${data.victimName}`;
        chatDiv.appendChild(killMsg);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        updateLeaderboard();
        return;
    }

    if(data.type === "chat") {
        const line = document.createElement("div");
        line.textContent = `${data.username}: ${data.message}`;
        chatDiv.appendChild(line);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        if(chatDiv.childNodes.length > 50) chatDiv.removeChild(chatDiv.firstChild);
        return;
    }
};

// ===================================
// UI EVENT LISTENERS (modified start logic)
// ===================================

// admin toggle is already defined above (for panel visibility)

// START GAME button — now supports typing "admin" to trigger admin login
startGameBtn.addEventListener("click", ()=>{
    if (socket.readyState !== WebSocket.OPEN || startGameBtn.disabled) return;

    const typed = (startupUsernameInput.value || "").trim();
    if(!typed) return;

    if(typed.toLowerCase() === "admin") {
        // Show admin password prompt only (do not start game)
        document.getElementById("adminPasswordContainer").style.display = "block";
        adminPasswordInput.value = "";
        adminPasswordInput.focus();
        connectStatus.textContent = "Admin login: enter password and press Enter";

        // On Enter in the admin password input, send adminAuth
        const onAdminEnter = (e) => {
            if(e.key === "Enter") {
                const pw = adminPasswordInput.value.trim();
                if(!pw) { alert("Enter password"); return; }
                adminPassword = pw; // keep it so future admin commands include it
                socket.send(JSON.stringify({type:"adminAuth", password: adminPassword}));
                adminPasswordInput.removeEventListener("keydown", onAdminEnter);
                // hide it — we'll reveal admin UI only if server authorizes
                document.getElementById("adminPasswordContainer").style.display = "none";
                connectStatus.textContent = "Authenticating admin...";
            }
        };
        adminPasswordInput.addEventListener("keydown", onAdminEnter);
        return;
    }

    // Normal player flow:
    const username = typed.slice(0,16) || "Player";
    player.username = username;
    adminPassword = ""; // clear any admin password
    socket.send(JSON.stringify({type:"setName", name: player.username}));
    startupScreen.style.display = 'none';
});

// chat input send
chatInput.addEventListener("keydown", e=>{
    if(e.key === "Enter" && chatInput.value.trim() !== "" && player.id && startupScreen.style.display === 'none') {
        const msg = chatInput.value.trim();
        socket.send(JSON.stringify({type:"chat", message: msg}));
        chatInput.value = "";
    }
});

// keyboard and mouse controls are unchanged:
document.addEventListener("keydown", e => keys[e.key]=true);
document.addEventListener("keyup", e => keys[e.key]=false);

canvas.addEventListener("click", e=>{
    if(player.deadUntil > Date.now() || startupScreen.style.display !== 'none') return;

    const now = Date.now();
    if(now - lastShot < SHOT_COOLDOWN_MS) return;
    lastShot = now;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const angle = Math.atan2(my - player.y, mx - player.x);
    const dx = Math.cos(angle) * BULLET_SPEED;
    const dy = Math.sin(angle) * BULLET_SPEED;

    socket.send(JSON.stringify({ type:"shoot", angle: angle, x: player.x, y: player.y }));
    bullets.push({x: player.x, y: player.y, dx, dy, t: Date.now(), owner: player.id});
    player.vx -= dx * 0.02;
    player.vy -= dy * 0.02;
});

// Collisions, update loop, draw loop — unchanged (keeps original behavior).
// Important: client now trusts server state updates (via socket.onmessage "state") and will reflect server-side regen.

function checkWallCollision(x, y, size) {
    for(const wall of WALLS) {
        if(x + size > wall.x && x - size < wall.x + wall.width && y + size > wall.y && y - size < wall.y + wall.height) {
            return wall;
        }
    }
    return null;
}

/* ---------- update(), updatePhysics(), draw(), gameLoop() ----------
   Use your original functions verbatim here — they are unchanged except they
   now benefit from receiving the server's authoritative state for your own player.
   (When you paste the file, please keep the update/draw sections exactly as in your original.)
--------------------------------------------------------------------- */

gameLoop(); // start the loop (keeps your existing loops and logic)
</script>
